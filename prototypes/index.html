<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rivera · Menu Prototypes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/brand.css">
<script src="shared/data.js"></script>
<script src="shared/brand.js"></script>
<style>
  header { text-align: center; padding: 50px 16px 10px; }
  header h1 { font-family: 'Amiri', serif; font-size: 30px; margin-top: 18px; }
  header p { color: var(--muted); margin-top: 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 28px; max-width: 1500px; margin: 30px auto; padding: 0 16px 60px; }
  .p { display: flex; flex-direction: column; align-items: center; gap: 14px; text-decoration: none; color: inherit; }
  .phone { width: 250px; height: 520px; border-radius: 38px; padding: 10px; background: #0a0908; box-shadow: 0 0 0 1px rgba(201,154,107,.5), 0 30px 60px rgba(0,0,0,.5); transition: transform .4s; }
  .p:hover .phone { transform: translateY(-8px); box-shadow: 0 0 0 1px var(--gold), 0 40px 70px rgba(0,0,0,.6); }
  .phone .scr { width: 100%; height: 100%; border-radius: 30px; overflow: hidden; position: relative; }
  .phone iframe { width: 375px; height: 750px; border: 0; transform: scale(.6187); transform-origin: top left; pointer-events: none; }
  [dir=rtl] .phone iframe { transform-origin: top right; position: absolute; right: 0; }
  .num { font-family: 'Cinzel', serif; color: var(--gold); letter-spacing: .3em; font-size: 12px; }
  .p h2 { font-family: 'Amiri', serif; font-size: 24px; }
  .p .d { color: #cdbcb0; font-size: 14px; text-align: center; max-width: 280px; line-height: 1.7; }
  .open { border: 1px solid var(--gold); color: var(--gold-hi); border-radius: 99px; padding: 7px 18px; font-size: 14px; }
</style>
</head>
<body class="marble">
  <header><div id="logo"></div><h1 class="gold-text">اختار شكل المينيو</h1><p>5 بروتوتايبس بنفس البيانات والهوية. افتح كل واحد وجرّبه على الموبايل.</p></header>
  <div class="grid" id="grid"></div>
<script>
const list = [
  ['1-book.html', 'الكتاب', 'The Book', 'نفس فكرة المينيو الورقي: غلاف رخام، وصفحات كريمية بتقلبها بإصبعك بحركة ثلاثية الأبعاد. على الكمبيوتر بتنفتح صفحتين جنب بعض.'],
  ['2-marble.html', 'رخام وذهب', 'Marble & Gold', 'صفحة تمرير طويلة: غبار ذهبي، أغصان بتتحرك مع التمرير، شريط أقسام ذهبي، وكروت أصناف بتظهر وبتلمع.'],
  ['3-paper.html', 'الورقة الحيّة', 'Living Paper', 'نسخة رقمية من الورقة الداخلية. الأقسام "بتنطبع" وانت بتمرر، وفيها بحث وتبديل بين قائمة وصور، والورقة بتميل مع حركة الجوال.'],
  ['4-cards.html', 'الكروت', 'Card Deck', 'كل صنف كرت فاخر في عرض ثلاثي الأبعاد. تسحب بينهم، وتقلب الكرت لتشوف التفاصيل والأحجام. لما تغيّر القسم الكروت بتتوزع من جديد.'],
  ['5-dial.html', 'القرص', 'The Dial', 'قرص ذهبي مثل الصحن بتلفّه بإصبعك لتختار القسم، والأصناف بتطلع فوقه. حركة مختلفة وممتعة.']
];
logo.innerHTML = RIVERA.logo();
grid.innerHTML = list.map(([f, ar, en, d], i) => `
  <a class="p" href="${f}" target="_blank">
    <div class="phone"><div class="scr"><iframe src="${f}" loading="lazy" tabindex="-1" scrolling="no"></iframe></div></div>
    <div class="num">0${i + 1} · ${en.toUpperCase()}</div>
    <h2 class="gold-text">${ar}</h2>
    <div class="d">${d}</div>
    <span class="open">افتح ↗</span>
  </a>`).join('');
</script>
</body>
</html>
