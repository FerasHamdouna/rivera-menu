<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rivera · The Dial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/brand.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="shared/data.js"></script>
<script src="shared/brand.js"></script>
<style>
  html, body { overflow: hidden; }
  body { height: 100svh; display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; align-items: center; justify-content: center; padding: 12px 0 0; }
  header .logo { transform: scale(.6); margin: -14px 0 -20px; }

  .wrap { position: relative; display: grid; grid-template-rows: 1fr auto; min-height: 0; }
  @media (min-width: 900px) { .wrap { grid-template-rows: none; grid-template-columns: 1fr 520px; } }

  /* Items panel */
  .panel { position: relative; min-height: 0; overflow-y: auto; padding: 8px 18px 20px; scrollbar-width: none; mask-image: linear-gradient(transparent, #000 18px, #000 calc(100% - 40px), transparent); }
  .title { text-align: center; margin: 6px 0 14px; }
  .title h1 { font-family: 'Amiri', serif; font-size: 34px; line-height: 1.1; }
  [lang=en] .title h1 { font-family: 'Cinzel', serif; font-size: 26px; }
  .title .en { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: .4em; color: var(--muted); }
  .title > * { animation: up .6s cubic-bezier(.2,.9,.2,1) both; }
  .title .en { animation-delay: .08s; }
  .items { list-style: none; display: grid; gap: 10px; max-width: 560px; margin: 0 auto; }
  .item { display: grid; grid-template-columns: 58px 1fr auto; gap: 12px; align-items: center; padding: 8px; padding-inline-end: 14px; border-radius: 18px; cursor: pointer;
    background: linear-gradient(90deg, rgba(201,154,107,.08), rgba(201,154,107,.02)); border: 1px solid rgba(201,154,107,.18);
    animation: up .6s cubic-bezier(.2,.9,.2,1) both; transition: border-color .3s, background .3s; }
  .item:hover { border-color: var(--gold); background: rgba(201,154,107,.12); }
  .item .art { width: 58px; height: 58px; border-radius: 14px; }
  .item .nm { font-weight: 700; font-size: 17px; }
  .item .sub { font-size: 12.5px; color: var(--muted); font-family: 'Cormorant Garamond', 'Tajawal', serif; font-style: italic; }
  .item .pr { font-family: 'Cinzel', serif; font-weight: 700; font-size: 17px; text-align: end; white-space: nowrap; }
  .item .pr small { display: block; font-size: 10px; color: var(--gold); letter-spacing: .1em; }
  .items.out .item { animation: down .3s ease-in both; }
  @keyframes up { from { opacity: 0; transform: translateY(26px) scale(.97); } }
  @keyframes down { to { opacity: 0; transform: translateY(-18px); } }

  /* The dial: a gold-rimmed saucer, half visible at the bottom on phones */
  .dock { position: relative; height: 230px; overflow: hidden; touch-action: none; user-select: none; }
  @media (min-width: 900px) { .dock { height: auto; display: grid; place-items: center; } }
  .dial { --rot: 0deg; position: absolute; left: 50%; top: 38px; width: 440px; height: 440px; margin-left: -220px; border-radius: 50%; cursor: grab;
    background: radial-gradient(circle, #1c1714 0 38%, transparent 38.3%), radial-gradient(circle, transparent 0 60%, rgba(201,154,107,.06) 60% 100%), conic-gradient(from 0deg, #2a221d, #1a1512, #2a221d, #1a1512, #2a221d);
    box-shadow: 0 0 0 1px var(--gold), 0 0 0 7px #120f0d, 0 0 0 8px rgba(201,154,107,.5), 0 -10px 60px rgba(201,154,107,.18), inset 0 0 40px rgba(0,0,0,.6);
    transform: rotate(var(--rot)); transition: transform .8s cubic-bezier(.25,1.3,.4,1); }
  @media (min-width: 900px) { .dial { position: relative; left: auto; top: auto; margin: 0; width: 460px; height: 460px; } }
  .dial.dragging { transition: none; cursor: grabbing; }
  .ticks { position: absolute; inset: 0; border-radius: 50%; background: repeating-conic-gradient(rgba(201,154,107,.5) 0 .4deg, transparent .4deg 6deg); mask: radial-gradient(circle, transparent 0 46.5%, #000 46.6% 48.5%, transparent 48.6%); }
  .spoke { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  .spoke button { position: absolute; width: 64px; height: 64px; margin: -32px; border-radius: 50%; display: grid; place-items: center; color: var(--muted);
    transform: translateY(-168px) rotate(calc(-1 * (var(--a) + var(--rot)))); transition: color .4s, background .4s, box-shadow .4s, transform .8s cubic-bezier(.25,1.3,.4,1); }
  .dial.dragging .spoke button { transition: none; }
  .spoke button svg { width: 26px; height: 26px; stroke-width: 1.3; }
  .spoke button.on { color: var(--ink); background: var(--gold-grad); box-shadow: 0 0 0 4px rgba(201,154,107,.25), 0 0 30px rgba(201,154,107,.5); }
  .hub { position: absolute; inset: 31%; border-radius: 50%; display: grid; place-items: center; text-align: center; box-shadow: inset 0 0 0 1px rgba(201,154,107,.5); transform: rotate(calc(-1 * var(--rot))); transition: transform .8s cubic-bezier(.25,1.3,.4,1); }
  .dial.dragging .hub { transition: none; }
  .hub .crown { color: var(--gold); width: 40px; }
  .hub .lbl { font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: .3em; color: var(--muted); margin-top: 4px; }
  /* Pointer marking the selected slot */
  .needle { position: absolute; left: 50%; top: 0; width: 0; height: 0; border: 9px solid transparent; border-top: 12px solid var(--gold); margin-left: -9px; z-index: 3; filter: drop-shadow(0 2px 6px rgba(201,154,107,.6)); }
  @media (min-width: 900px) { .needle { top: calc(50% - 248px); } }
  .help { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; font-size: 11px; color: var(--muted); letter-spacing: .1em; pointer-events: none; }
</style>
</head>
<body class="marble">
  <header id="head"></header>
  <div class="wrap">
    <div class="panel" id="panel"><div class="title" id="title"></div><ul class="items" id="items"></ul></div>
    <div class="dock" id="dock"><div class="needle"></div><div class="dial" id="dial"><div class="ticks"></div><div class="hub" id="hub"></div></div><div class="help" id="help"></div></div>
  </div>
<script>
const R = RIVERA, n = R.sections.length, step = 360 / n;
let si = 0, rot = 0;

function buildDial() {
  dial.querySelectorAll('.spoke').forEach((s) => s.remove());
  R.sections.forEach((s, i) => {
    const sp = document.createElement('div');
    sp.className = 'spoke';
    sp.style.transform = `rotate(${i * step}deg)`;
    sp.style.setProperty('--a', i * step + 'deg');
    sp.innerHTML = `<button data-i="${i}" aria-label="${s.en}"><i data-lucide="${s.icon}"></i></button>`;
    dial.appendChild(sp);
  });
  hub.innerHTML = `<div><div class="crown">${R.crown}</div><div class="lbl">RIVERA</div></div>`;
}

function showSection(animate = true) {
  const s = R.sections[si];
  dial.querySelectorAll('.spoke button').forEach((b) => b.classList.toggle('on', +b.dataset.i === si));
  const paint = () => {
    title.innerHTML = `<h1 class="gold-text">${R.t(s)}</h1><div class="en">${s.en.toUpperCase()}</div>`;
    items.classList.remove('out');
    items.innerHTML = s.items.map((it, i) => `
      <li class="item ${R.isOut(it) ? 'is-out' : ''}" data-i="${i}" style="animation-delay:${.05 + i * .05}s">
        ${R.art(s, it, i)}
        <div><div class="nm">${R.t(it)} ${R.isOut(it) ? `<span class="badge-out">${R.s('out')}</span>` : ''}</div><div class="sub">${R.desc(it) || (R.lang === 'ar' ? it.en : it.ar)}</div></div>
        <div class="pr"><span class="gold-text">${R.price(it)}</span>${it.price != null && !it.sizes ? '<small>₪</small>' : ''}</div>
      </li>`).join('');
    panel.scrollTop = 0;
    R.icons();
  };
  if (animate && items.children.length) { items.classList.add('out'); setTimeout(paint, 260); } else paint();
}

function setRot(r, snap) {
  rot = r;
  dial.style.setProperty('--rot', rot + 'deg');
  if (snap) {
    const i = ((Math.round(-rot / step) % n) + n) % n;
    if (i !== si) { si = i; showSection(); navigator.vibrate?.(8); }
  }
}
const goTo = (i) => {
  // Shortest way round to slot i
  let target = -i * step, diff = ((target - rot) % 360 + 540) % 360 - 180;
  setRot(rot + diff, true);
};

// Drag the dial by the angle around its centre
let drag = null;
dock.addEventListener('pointerdown', (e) => {
  const r = dial.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  drag = { cx, cy, a0: Math.atan2(e.clientY - cy, e.clientX - cx), rot0: rot, moved: false, target: e.target };
  dock.setPointerCapture(e.pointerId);
});
dock.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const a = Math.atan2(e.clientY - drag.cy, e.clientX - drag.cx);
  let d = ((a - drag.a0) * 180) / Math.PI;
  if (Math.abs(d) > 3) { drag.moved = true; dial.classList.add('dragging'); }
  if (drag.moved) {
    setRot(drag.rot0 + d);
    const i = ((Math.round(-rot / step) % n) + n) % n;
    dial.querySelectorAll('.spoke button').forEach((b) => b.classList.toggle('on', +b.dataset.i === i));
  }
});
dock.addEventListener('pointerup', (e) => {
  if (!drag) return;
  dial.classList.remove('dragging');
  if (drag.moved) setRot(Math.round(rot / step) * step, true);
  else {
    const b = document.elementFromPoint(e.clientX, e.clientY)?.closest('.spoke button');
    if (b) goTo(+b.dataset.i);
  }
  drag = null;
});
// Mouse wheel turns the dial on desktop
dock.addEventListener('wheel', (e) => { e.preventDefault(); goTo((si + (e.deltaY > 0 ? 1 : -1) + n) % n); }, { passive: false });
items.addEventListener('click', (e) => {
  const li = e.target.closest('.item'); if (!li) return;
  const s = R.sections[si];
  R.openSheet(s, s.items[li.dataset.i], +li.dataset.i);
});

function render() {
  head.innerHTML = R.logo();
  help.textContent = R.lang === 'ar' ? 'لفّ القرص لاختيار القسم' : 'Turn the dial to choose';
  buildDial(); R.icons(); setRot(rot); showSection(false);
}
R.mountLang(render);
render();
</script>
</body>
</html>
